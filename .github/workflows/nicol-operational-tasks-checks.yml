name: Nicol appointment tasks checks

on:
  pull_request:
    paths:
      - 'app/Services/Scheduling/AdmissionTaskService.php'
      - 'app/Http/Controllers/Scheduling/AdmissionTaskController.php'
      - 'app/Services/Scheduling/AdmissionBoardService.php'
      - 'routes/scheduling.php'
      - 'database/migrations/2026_10_16_010000_create_appointment_admission_tasks.php'
      - 'public/js/scheduling/admission-board.js'
      - 'public/css/scheduling/admission-board.css'
      - 'tests/Feature/Scheduling/AdmissionTaskTest.php'
      - 'tests/JavaScript/admission-tasks-ui.test.js'
      - '.github/workflows/nicol-operational-tasks-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  js-and-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JS syntax and tests
        run: |
          node --check public/js/scheduling/admission-board.js
          node --test tests/JavaScript/admission-tasks-ui.test.js tests/JavaScript/admission-board.test.js
      - name: Check PHP syntax
        run: |
          php -l app/Services/Scheduling/AdmissionTaskService.php
          php -l app/Http/Controllers/Scheduling/AdmissionTaskController.php
          php -l app/Services/Scheduling/AdmissionBoardService.php
          php -l database/migrations/2026_10_16_010000_create_appointment_admission_tasks.php
          php -l tests/Feature/Scheduling/AdmissionTaskTest.php
          php -l routes/scheduling.php

  php-feature:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, zip, curl, fileinfo, gd
          coverage: none
      - name: Install locked dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Test Nicol task permissions, privacy, idempotency and audit (SQLite isolated)
        run: php artisan test --filter=AdmissionTaskTest
      - name: Existing admission privacy regressions
        run: php artisan test --filter=AppointmentVisibilityTest
