name: Admission manual reevaluation hotfix
on:
  pull_request:
    paths:
      - 'app/Services/Scheduling/ManualReevaluationService.php'
      - 'app/Services/Scheduling/AdmissionBoardService.php'
      - 'app/Support/Scheduling/AdmissionAppointmentPresentation.php'
      - 'app/Http/Controllers/Scheduling/ManualReevaluationController.php'
      - 'app/Http/Controllers/Scheduling/AdmissionBoardController.php'
      - 'routes/scheduling.php'
      - 'public/js/scheduling/admission-board.js'
      - 'public/css/scheduling/admission-board.css'
      - 'resources/views/scheduling/admission/**'
      - 'tests/Feature/Scheduling/ManualReevaluationTest.php'
      - 'tests/JavaScript/admission-booking-indicator.test.js'
      - '.github/workflows/admission-manual-reevaluation-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, dom, xml, zip, curl, fileinfo, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: mkdir -p storage/app/hotfix-qa
      - run: php vendor/phpunit/phpunit/phpunit --log-junit storage/app/hotfix-qa/phpunit.xml
      - run: node --check public/js/scheduling/admission-board.js
      - run: node --test tests/JavaScript/*.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: admission-hotfix-tests
          path: storage/app/hotfix-qa/phpunit.xml
