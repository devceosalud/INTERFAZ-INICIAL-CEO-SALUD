name: Agenda Yape OCR manual-flow regressions

on:
  pull_request:
    paths:
      - 'public/js/scheduling/appointment-receipt-ocr.js'
      - 'public/js/scheduling/appointment-receipt-review.js'
      - 'public/js/scheduling/agenda-operational-workspace.js'
      - 'public/js/scheduling/agenda.js'
      - 'public/css/scheduling/agenda-layout.css'
      - 'tests/JavaScript/agenda-yape-ocr-manual-flow.test.js'
      - 'tests/JavaScript/appointment-receipt-review.test.js'
      - 'tests/JavaScript/appointment-receipt-ocr.test.js'
      - '.github/workflows/agenda-yape-ocr-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: |
          node --check public/js/scheduling/appointment-receipt-ocr.js
          node --check public/js/scheduling/appointment-receipt-review.js
          node --check public/js/scheduling/agenda-operational-workspace.js
          node --check public/js/scheduling/agenda.js
      - name: OCR, review, form and button regressions
        run: |
          node --test \
            tests/JavaScript/agenda-yape-ocr-manual-flow.test.js \
            tests/JavaScript/appointment-receipt-ocr.test.js \
            tests/JavaScript/appointment-receipt-review.test.js \
            tests/JavaScript/agenda-payment-ocr-placement.test.js \
            tests/JavaScript/agenda-payment-ux-closure.test.js \
            tests/JavaScript/agenda-form-validation.test.js \
            tests/JavaScript/agenda-modal-explicit-actions.test.js \
            tests/JavaScript/agenda-quote-race.test.js
